name: Portfolio Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan credentials in current tree and history
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          patterns = [
              ('private/wallet key', re.compile(r'(?i)(?:private|wallet|secret|clean|compromised)[_ -]*(?:key|keypair|pk)[^\n]{0,100}?(?:0x)?[0-9a-f]{64}')),
              ('secret assignment', re.compile(r'(?i)(?:PRIVATE_KEY|WALLET_PRIVATE_KEY|SECRET_KEY|SOLANA_PRIVATE_KEY|JWT_SECRET|AUTH_SECRET|SUPABASE_SERVICE_ROLE_KEY|DISCORD_BOT_TOKEN)\s*[:=]\s*["\']?(?!your_|example|replace|change|process\.|os\.|env\.|<)[A-Za-z0-9+/=_-]{32,}')),
              ('Solana keypair array', re.compile(r'(?is)(?:secret|private|wallet)[_ -]*(?:key|keypair|pk)[^=\n]{0,60}[=:]\s*\[(?:\s*\d{1,3}\s*,){31,}\s*\d{1,3}\s*\]')),
              ('PEM private key', re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')),
              ('GitHub token', re.compile(r'\b(?:ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})\b')),
              ('OpenAI key', re.compile(r'\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b')),
              ('Google API key', re.compile(r'\bAIza[0-9A-Za-z_-]{30,}\b')),
              ('AWS access key', re.compile(r'\bAKIA[0-9A-Z]{16}\b')),
              ('Telegram token', re.compile(r'\b\d{8,12}:[A-Za-z0-9_-]{30,}\b')),
              ('Stripe live key', re.compile(r'\b(?:sk|rk)_live_[A-Za-z0-9]{16,}\b')),
              ('Slack token', re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{20,}\b')),
              ('keyed RPC', re.compile(r'https?://[^\s"\']*(?:alchemy\.com/v2|infura\.io/v3)/[A-Za-z0-9_-]{16,}', re.I)),
          ]
          credential_file = re.compile(r'(^|/)(?:\.env(?:\..+)?|credentials\.json|service-account[^/]*\.json|[^/]+\.(?:pem|p12|pfx|key))$', re.I)
          templates = {'.env.example', 'env.example', '.env.sample', 'env.sample'}

          findings = []
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode(errors='ignore').split('\0')
          for filename in filter(None, files):
              basename = Path(filename).name
              if credential_file.search(filename.replace('\\', '/')) and basename not in templates:
                  findings.append((filename, 'credential filename'))
              try:
                  text = Path(filename).read_text('utf-8', errors='ignore')
              except Exception:
                  continue
              if basename not in templates:
                  for name, pattern in patterns:
                      if pattern.search(text):
                          findings.append((filename, name))

          if findings:
              print('Current-tree credential findings:')
              for filename, name in sorted(set(findings)):
                  print(f' - {filename}: {name}')
              sys.exit(1)

          history_findings = []
          seen = set()
          objects = subprocess.check_output(['git', 'rev-list', '--objects', '--all'], text=True, errors='ignore').splitlines()
          for row in objects:
              parts = row.split(' ', 1)
              object_id = parts[0]
              path = parts[1] if len(parts) > 1 else '<unknown>'
              if object_id in seen:
                  continue
              seen.add(object_id)
              try:
                  if subprocess.check_output(['git', 'cat-file', '-t', object_id], text=True, stderr=subprocess.DEVNULL).strip() != 'blob':
                      continue
                  if int(subprocess.check_output(['git', 'cat-file', '-s', object_id], text=True, stderr=subprocess.DEVNULL).strip()) > 2_000_000:
                      continue
                  text = subprocess.check_output(['git', 'cat-file', '-p', object_id], stderr=subprocess.DEVNULL).decode('utf-8', errors='ignore')
              except Exception:
                  continue
              if Path(path).name not in templates:
                  for name, pattern in patterns:
                      if pattern.search(text):
                          history_findings.append((path, name))
                          break

          if history_findings:
              print('::warning::Credential-like material exists in Git history; rotate affected credentials before any history rewrite.')
              for filename, name in sorted(set(history_findings))[:100]:
                  print(f' history: {filename}: {name}')
          else:
              print('Credential scan passed.')
          PY

      - name: Audit production dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
